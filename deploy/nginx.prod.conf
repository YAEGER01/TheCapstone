# Nginx PRODUCTION config — isucaufa-fms.online (Let's Encrypt).
# Generated alongside deploy/nginx.conf (local/mkcert). Use this file on the
# Linux server:  sudo cp deploy/nginx.prod.conf /etc/nginx/nginx.conf
# Full flow is automated by deploy/enable_prod_tls.sh.
#
# Assumes: Daphne on 127.0.0.1:5000, certbot has issued for both names.

worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    upstream daphne {
        server 127.0.0.1:5000;
    }

    # --- ACME challenge MUST stay on HTTP or certbot/renew breaks ---
    server {
        listen       80;
        server_name  isucaufa-fms.online www.isucaufa-fms.online;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        server_name  isucaufa-fms.online www.isucaufa-fms.online;

        ssl_certificate      /etc/letsencrypt/live/isucaufa-fms.online/fullchain.pem;
        ssl_certificate_key  /etc/letsencrypt/live/isucaufa-fms.online/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        # Edge mirror of core_system.middleware.SecurityHeadersMiddleware (nginx
        # wins if both set — keep in sync when tightening CSP_POLICY).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://cdn.tailwindcss.com https://cdn.jsdelivr.net; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://challenges.cloudflare.com https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

        client_max_body_size 20M;

        # --- NEVER serve DB dumps / backups over HTTP (defense in depth
        #     behind media/.htaccess, which nginx does not read).
        #     New backups live outside the webroot; this covers legacy
        #     media/backups/* in every stored format (incl. encrypted .enc).
        location ~* ^/media/(backups/.*|.*\.(sql|db|sqlite3|sqlite|bak|env|gz|zip|tar|json|enc)(\..*)?$) {
            return 404;
        }

        location ~ /(ws/|__reload__/) {
            proxy_pass http://daphne;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
        }

        location / {
            proxy_pass http://daphne;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;
        }
    }
}
