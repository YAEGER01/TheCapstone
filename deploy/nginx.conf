# Nginx config — LOCAL/dev (mkcert certs). TLS-terminating reverse proxy to
# Daphne (ASGI) + WebSocket. Works on Windows (C:\nginx\conf\nginx.conf).
#
# PRODUCTION uses deploy/nginx.prod.conf instead (Let's Encrypt paths,
# prod server_names, dump-blocking) — provisioned end-to-end by
# deploy/enable_prod_tls.sh. Do NOT copy this file to the server.
#
# Steps (local):
#   1. .\scripts\setup_local_tls.ps1   (mkcert -> certs/)
#   2. Backup your existing nginx.conf, then replace with this file.
#   3. Adjust ssl_certificate paths + server_name if the project moved.
#   4. nginx -t
#   5. nginx -s reload
#
# Optional — for nginx to serve static/media directly (faster):
#   Add to settings.py: STATIC_ROOT = BASE_DIR / "staticfiles"
#   Then run:  python manage.py collectstatic --noinput

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # --- Daphne back-end ---
    upstream daphne {
        server 127.0.0.1:5000;
    }

    # --- Plain HTTP: redirect everything to HTTPS ---
    # (Keep this server even on dev machines: it is what makes
    #  SECURE_SSL_REDIRECT + HSTS work instead of looping.)
    server {
        listen       80;
        server_name  localhost 127.0.0.1 isucaufa-fms.online www.isucaufa-fms.online;
        return 301 https://$host$request_uri;
    }

    server {
        # Windows local (mkcert):  listen 443 ssl;
        # Linux prod (certbot):    same — just point ssl_certificate at
        #   /etc/letsencrypt/live/<domain>/fullchain.pem (+ privkey.pem).
        listen       443 ssl;
        server_name  localhost 127.0.0.1 isucaufa-fms.online www.isucaufa-fms.online;

        # --- Certificate paths: uncomment the pair that fits ---
        # Local dev (created by scripts/setup_local_tls.ps1):
        ssl_certificate      C:/Users/maday/PROJECTS/CAUFASYSTEM/certs/localhost+2.pem;
        ssl_certificate_key  C:/Users/maday/PROJECTS/CAUFASYSTEM/certs/localhost+2-key.pem;
        # Production (certbot):
        # ssl_certificate      /etc/letsencrypt/live/isucaufa-fms.online/fullchain.pem;
        # ssl_certificate_key  /etc/letsencrypt/live/isucaufa-fms.online/privkey.pem;

        # --- Modern TLS only (TLS 1.2 + 1.3, no TLS 1.0/1.1, no weak ciphers) ---
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # --- HSTS (also sent by Django; belt and suspenders at the edge) ---
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # --- OCSP stapling (prod; harmless if the resolver is unreachable) ---
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # resolver 1.1.1.1 8.8.8.8 valid=300s;

        # --- Optional mTLS upgrade (Zero-Trust device binding, phase 2) ---
        # Issues per-device client certs, then Django binds the fingerprint
        # into AccessSession.session_policy["mtls_fp"] (see
        # core_system/device_binding.py). Leave OFF until client certs exist —
        # `ssl_verify_client on` without them blocks ALL traffic.
        # ssl_verify_client off;
        # ssl_verify_depth 2;
        # ssl_cadata /path/to/client-ca.crt;
        # proxy_set_header X-Client-Cert-Fingerprint $ssl_client_fingerprint;

        client_max_body_size 20M;

        # --- Uncomment when you have STATIC_ROOT set ---
        # location /static/ {
        #     alias C:/Users/maday/PROJECTS/CAUFASYSTEM/staticfiles/;
        #     expires 30d;
        #     access_log off;
        # }

        # --- Media uploads ---
        # WARNING: if nginx serves /media/ directly, the media/.htaccess +
        # media/web.config dump-blocking rules do NOT apply (those are
        # Apache/IIS). Either keep /media/ proxied to Django (default below)
        # or replicate the deny (*.sql/*.db/backups/) in nginx:
        # location ~* ^/media/(backups/.*|.*\.(sql|db|sqlite3|sqlite|bak|env)(\..*)?$) { return 404; }
        # location /media/ {
        #     alias C:/Users/maday/PROJECTS/CAUFASYSTEM/media/;
        #     expires 30d;
        # }

        # --- WebSocket (django_channels + django_browser_reload) ---
        location ~ /(ws/|__reload__/) {
            proxy_pass http://daphne;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
        }

        # --- Everything else ---
        location / {
            proxy_pass http://daphne;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_redirect off;
        }
    }
}
