<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISUCauFA | Forgot Password</title>
    <link rel="icon" type="image/png" href="{% static 'img/isu_caufa_official.png' %}" />
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}" />
    <link rel="stylesheet" href="{% static 'vendor/css/fonts.css' %}" />
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
    <style>
      .submit-btn {
        background: linear-gradient(135deg, #1b5e20 0%, #14521b 100%);
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(27, 94, 63, 0.2);
      }
      .submit-btn:hover {
        background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
      }
    </style>
  </head>
  <body>
    <a href="{% url 'login' %}" class="sticky-back-home">
      <i class="fa-solid fa-arrow-left"></i> Back to Login
    </a>
    <section class="login-shell">
      <div class="brand">
        <img src="{% static 'img/isu_caufa_official.png' %}" alt="ISUCauFA, Inc. logo" />
        <div>
          <strong>ISUCauFA</strong>
          <span>Forgot Password</span>
        </div>
      </div>

      <form method="post" novalidate id="forgotForm">
        {% csrf_token %}

        {% if messages %}
          {% for message in messages %}
            <p class="error-note" style="color: {% if message.tags == 'success' %}#1b5e20{% else %}#d32f2f{% endif %}; margin-bottom: 15px; font-size: 14px; font-weight: 500;">
              <i class="fa-solid {% if message.tags == 'success' %}fa-circle-check{% else %}fa-circle-exclamation{% endif %}"></i> {{ message }}
            </p>
          {% endfor %}
        {% endif %}

        <div id="forgotError" class="login-status-card login-status-error" style="display: none;" role="alert"></div>

        <p style="font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.6;">
          Enter your email address below and we'll send you a one-time verification code to reset your password.
        </p>

        <div>
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <i class="fa-regular fa-envelope field-icon" aria-hidden="true"></i>
            <input id="email" name="email" type="email" placeholder="Enter your registered email" required autofocus />
          </div>
        </div>

        <button class="submit-btn" type="submit" id="sendBtn">
          Send Verification Code
        </button>
      </form>
    </section>

    <script>
      (function () {
        var form = document.getElementById('forgotForm');
        var sendBtn = document.getElementById('sendBtn');
        var errorBox = document.getElementById('forgotError');

        form.addEventListener('submit', function (e) {
          errorBox.style.display = 'none';
          sendBtn.disabled = true;
          sendBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Sending...';
        });
      })();
    </script>
  </body>
</html>
