{% load static %}
<!-- Shared feedback mount point. One include per dashboard (President,
     Treasurer, Auditor, Member).
     The dashboard only supplies this fetch trigger plus the assets; the toast
     and modal themselves are mounted under <body> by feedback_card.js so the
     overlay is not trapped inside the dashboard's overflow:hidden shell.

     The content is fetched lazily (on browser idle), so a Superadmin can
     publish or retire a form without any dashboard template changing. The
     endpoint returns an empty body unless there is an open form for this
     role AND the viewer has not already responded. -->
<div id="fb-card-root" class="fb-root" data-fb-endpoint="{% url 'feedback_card' %}" hidden></div>
<link rel="stylesheet" href="{% static 'css/feedback_card.css' %}?v=20261015fb6" />
<script src="{% static 'js/shared/feedback_card.js' %}?v=20261015fb6" defer></script>
